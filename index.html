.draft-notice-copy strong small { font-weight: 500; white-space: nowrap; }

<script>

  function zip(entries) {

      l.setUint32(0, 0x04034b50, true); l.setUint16(4, 20, true); l.setUint16(6, 0x800, true);
      l.setUint16(10, dosTime, true); l.setUint16(12, dosDate, true); l.setUint32(14, checksum, true);
      l.setUint32(18, bytes.length, true); l.setUint32(22, bytes.length, true); l.setUint16(26, name.length, true); local.set(name, 30);
      const central = new Uint8Array(46 + name.length), c = new DataView(central.buffer);
      c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true); c.setUint16(8, 0x800, true);
      c.setUint16(12, dosTime, true); c.setUint16(14, dosDate, true); c.setUint32(16, checksum, true);
      c.setUint32(20, bytes.length, true); c.setUint32(24, bytes.length, true); c.setUint16(28, name.length, true);
      c.setUint32(42, offset, true); central.set(name, 46);

    }

    e.setUint32(0, 0x06054b50, true); e.setUint16(8, entries.length, true); e.setUint16(10, entries.length, true);

  function colName(index) {

  }
  function excel(options) {
    const { title, columns, rows } = input(options);

    const widths = columns.map((name, c) => Math.min(65, Math.max(16, name.length + 4, ...rows.map(row => Math.min(65, textValue(row[c]).length + 2)))));
    const entries = [
      ['[Content_Types].xml', '<?xml version="1.0" encoding="UTF-8"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>'],
      ['_rels/.rels', '<?xml version="1.0" encoding="UTF-8"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>'],
      ['xl/workbook.xml', '<?xml version="1.0" encoding="UTF-8"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="Laporan" sheetId="1" r:id="rId1"/></sheets></workbook>'],
      ['xl/_rels/workbook.xml.rels', '<?xml version="1.0" encoding="UTF-8"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>'],
      ['xl/styles.xml', '<?xml version="1.0" encoding="UTF-8"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="3"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="20"/><color rgb="FF2563EB"/><name val="Calibri"/></font><font><b/><sz val="11"/><color rgb="FFFFFFFF"/><name val="Calibri"/></font></fonts><fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FF2563EB"/><bgColor indexed="64"/></patternFill></fill></fills><borders count="1"><border/></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="3"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"><alignment vertical="top" wrapText="1"/></xf><xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/><xf numFmtId="0" fontId="2" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1"><alignment vertical="center" wrapText="1"/></xf></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>'],
      ['xl/worksheets/sheet1.xml', `<?xml version="1.0" encoding="UTF-8"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetViews><sheetView workbookViewId="0"><pane ySplit="5" topLeftCell="A6" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews><cols>${widths.map((w, i) => `<col min="${i + 1}" max="${i + 1}" width="${w}" customWidth="1"/>`).join('')}</cols><sheetData>${sheetRows}</sheetData><autoFilter ref="A5:${colName(columns.length - 1)}${Math.max(5, rows.length + 5)}"/></worksheet>`]
    ];
    download(new Blob([zip(entries)], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }), filename(title) + '.xlsx');
    return { rows: rows.length };
  }

  // The same paginated layout is used for PDF and PNG. Long cells continue on the
  // next page, so every row and all of its text remain available in the export.
  function layout(data, useAscii) {
    const width = 842, height = 595, margin = 28, fontSize = Math.max(6, Math.min(9, 68 / data.columns.length));
    const usable = width - 2 * margin;
    const weights = data.columns.map((name, i) => Math.min(35, Math.max(12, name.length, ...data.rows.map(row => Math.min(35, textValue(row[i]).length)))));
    const total = weights.reduce((a, b) => a + b, 0), widths = weights.map(w => usable * w / total);
    const lineHeight = fontSize + 4;
    const wrap = (value, col) => {
      const source = useAscii ? ascii(value) : textValue(value);
      const max = Math.max(2, Math.floor((widths[col] - 12) / (fontSize * 0.56)));
      return source.split('\n').flatMap(part => {
        const lines = []; let current = '';
        for (const word of part.split(/\s+/)) {
          if (current && current.length + word.length + 1 > max) { lines.push(current); current = ''; }
          let rest = word;
          while (rest.length > max) { if (current) { lines.push(current); current = ''; } lines.push(rest.slice(0, max)); rest = rest.slice(max); }
          current = current ? current + ' ' + rest : rest;
        }
        lines.push(current); return lines;
      });
    };
    const headers = data.columns.map(wrap), headerLines = Math.max(...headers.map(a => a.length));
    const headerHeight = headerLines * lineHeight + 14, start = 112 + headerHeight, bottom = height - 38;
    const pages = [[]]; let y = start;
    data.rows.forEach((row, rowIndex) => {
      const lines = row.map(wrap), count = Math.max(1, ...lines.map(a => a.length)); let lineOffset = 0;
      while (lineOffset < count) {
        let available = Math.floor((bottom - y - 12) / lineHeight);
        if (available < 1) { pages.push([]); y = start; available = Math.floor((bottom - y - 12) / lineHeight); }
        const take = Math.min(count - lineOffset, available), rowHeight = take * lineHeight + 12;
        pages[pages.length - 1].push({ rowIndex, y, height: rowHeight, lines: lines.map(cell => cell.slice(lineOffset, lineOffset + take)), continued: lineOffset > 0 });
        y += rowHeight; lineOffset += take;
      }
    });
    return { width, height, margin, fontSize, widths, lineHeight, headers, headerHeight, start, pages };
  }
  function pdf(options) {
    const data = input(options), l = layout(data, true), generated = stamp();
    const objects = [null, '', '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>', '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold >>'];
    const pageIds = [];
    const rgb = hex => [1, 3, 5].map(i => (parseInt(hex.slice(i, i + 2), 16) / 255).toFixed(3)).join(' ');
    l.pages.forEach((rows, pageIndex) => {
      let stream = '';
      const rect = (x, y, w, h, color) => { stream += `${rgb(color)} rg ${x.toFixed(2)} ${(l.height - y - h).toFixed(2)} ${w.toFixed(2)} ${h.toFixed(2)} re f\n`; };
      const txt = (s, x, y, size, color, bold = false) => { stream += `BT /F${bold ? 2 : 1} ${size} Tf ${rgb(color)} rg 1 0 0 1 ${x.toFixed(2)} ${(l.height - y).toFixed(2)} Tm (${pdfString(s)}) Tj ET\n`; };

      const heading = ascii(data.title); txt(heading.length > 95 ? heading.slice(0, 92) + '...' : heading, l.margin, 63, 22, colors.ink, true);
      txt(`Diekspor pada ${generated}  |  ${data.rows.length} data`, l.margin, 85, 9, colors.muted);
      rect(l.margin, 112, l.width - 2 * l.margin, l.headerHeight, colors.teal);
      let x = l.margin;
      l.headers.forEach((lines, c) => { lines.forEach((line, j) => txt(line, x + 6, 123 + j * l.lineHeight, l.fontSize, '#ffffff', true)); x += l.widths[c]; });
      for (const row of rows) {
        if (row.rowIndex % 2 === 0) rect(l.margin, row.y, l.width - 2 * l.margin, row.height, colors.pale);
        x = l.margin;
        row.lines.forEach((lines, c) => { lines.forEach((line, j) => txt(line, x + 6, row.y + 11 + j * l.lineHeight, l.fontSize, colors.ink)); x += l.widths[c]; });
        rect(l.margin, row.y + row.height - 0.4, l.width - 2 * l.margin, 0.4, colors.line);
      }
      if (!data.rows.length) txt('Belum ada data untuk periode ini.', l.margin + 6, l.start + 25, 11, colors.muted);
      txt(`Halaman ${pageIndex + 1} / ${l.pages.length}`, l.margin, l.height - 16, 8, colors.muted);
      const pageId = objects.length; objects.push('');
      const contentId = objects.length; objects.push(`<< /Length ${encoder.encode(stream).length} >>\nstream\n${stream}endstream`);

    });
    objects[1] = `<< /Type /Pages /Kids [${pageIds.map(id => id + ' 0 R').join(' ')}] /Count ${pageIds.length} >>`;
    const catalog = objects.length; objects.push('<< /Type /Catalog /Pages 1 0 R >>');

    result += `xref\n0 ${objects.length}\n0000000000 65535 f \n` + offsets.slice(1).map(n => String(n).padStart(10, '0') + ' 00000 n \n').join('');
    result += `trailer\n<< /Size ${objects.length} /Root ${catalog} 0 R >>\nstartxref\n${xref}\n%%EOF\n`;
    download(new Blob([result], { type: 'application/pdf' }), filename(data.title) + '.pdf');
    return { pages: l.pages.length, rows: data.rows.length };
  }
  async function image(options, px) {
    const data = input(options), l = layout(data, false), generated = stamp(), files = [];
    for (let index = 0; index < l.pages.length; index++) {
      const canvas = document.createElement('canvas'); canvas.width = l.width * 2; canvas.height = l.height * 2;

      const txt = (s, x, y, size, color, bold = false) => { ctx.fillStyle = color; ctx.font = `${bold ? 700 : 400} ${size}px Arial, sans-serif`; ctx.fillText(s, x, y); };
      rect(0, 0, l.width, 7, colors.teal); txt('EXATA / CONTENT HUB', l.margin, 34, 10, colors.teal, true);
      const heading = data.title; txt(heading.length > 95 ? heading.slice(0, 92) + '…' : heading, l.margin, 63, 22, colors.ink, true);
      txt(`Diekspor pada ${generated}  |  ${data.rows.length} data`, l.margin, 85, 9, colors.muted);
      rect(l.margin, 112, l.width - 2 * l.margin, l.headerHeight, colors.teal);
      let x = l.margin;
      l.headers.forEach((lines, c) => { lines.forEach((line, j) => txt(line, x + 6, 123 + j * l.lineHeight, l.fontSize, '#ffffff', true)); x += l.widths[c]; });
      for (const row of l.pages[index]) {
        if (row.rowIndex % 2 === 0) rect(l.margin, row.y, l.width - 2 * l.margin, row.height, colors.pale);
        x = l.margin;
        row.lines.forEach((lines, c) => { lines.forEach((line, j) => txt(line, x + 6, row.y + 11 + j * l.lineHeight, l.fontSize, colors.ink)); x += l.widths[c]; });
        rect(l.margin, row.y + row.height - 0.4, l.width - 2 * l.margin, 0.4, colors.line);
      }
      if (!data.rows.length) txt('Belum ada data untuk periode ini.', l.margin + 6, l.start + 25, 11, colors.muted);
      txt(`Halaman ${index + 1} / ${l.pages.length}`, l.margin, l.height - 16, 8, colors.muted);
      px?.to(20 + 70 * (index + 1) / l.pages.length, `Membuat gambar ${index + 1} dari ${l.pages.length}`);
      const blob = await new Promise((resolve, reject) => canvas.toBlob(b => b ? resolve(b) : reject(new Error('Gagal membuat PNG.')), 'image/png'));
      files.push([`${filename(data.title)}-${String(index + 1).padStart(2, '0')}.png`, new Uint8Array(await blob.arrayBuffer())]);

    if (files.length === 1) download(new Blob([files[0][1]], { type: 'image/png' }), filename(data.title) + '.png');
    else download(zip(files), filename(data.title) + '-gambar.zip');
    return { pages: l.pages.length, rows: data.rows.length, bundled: files.length > 1 };
  }
  window.ContentExport = Object.freeze({ excel, pdf, image });
})();

<script>
/* Local, per-account editor drafts. This file never sends data to a server. */
(function () {
  'use strict';

  const NAMESPACE = 'exata-draft-v1';
  const hasOwn = (object, key) => Object.prototype.hasOwnProperty.call(object, key);
  const isObject = value => value !== null && typeof value === 'object' && !Array.isArray(value);
  const unsafeName = name => /^(?:__proto__|prototype|constructor)$/i.test(name);
  const secretName = name => /^(?:password|passwd|pwd|token|access[_-]?token|refresh[_-]?token|id[_-]?token|authorization|api[_-]?key|client[_-]?secret)$/i.test(name);
  const safeName = name => name && !unsafeName(name) && !secretName(name);
  const esc = value => String(value ?? '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));

  function storageError(error) {
    if (/quota|ns_error_dom_quota_reached/i.test(String(error?.name || ''))) {
      return 'Penyimpanan browser penuh. Simpan isian ke Google Sheets atau kosongkan ruang browser.';
    }
    if (/security|notallowed/i.test(String(error?.name || ''))) {
      return 'Browser memblokir penyimpanan lokal. Izinkan penyimpanan situs agar draft dapat disimpan.';
    }
    return 'Penyimpanan lokal belum dapat digunakan. Isian belum tersimpan otomatis di perangkat ini.';
  }

  function createStore(scope) {
    // Callers supply endpoint + user identity, never an authentication token.
    const scopeId = String(scope ?? 'demo');
    let lastError = '';
    const key = (kind, id = 'new') => NAMESPACE + ':' + JSON.stringify([scopeId, String(kind), String(id)]);
    const validEnvelope = value => isObject(value) && value.version === 1 &&
      typeof value.savedAt === 'string' && Number.isFinite(Date.parse(value.savedAt)) &&
      new Date(value.savedAt).toISOString() === value.savedAt && isObject(value.payload);
    return Object.freeze({
      get lastError() { return lastError; },
      read(kind, id = 'new') {
        lastError = '';

          const raw = window.localStorage.getItem(key(kind, id));
          if (raw === null) return null;
          let result;
          try { result = JSON.parse(raw); } catch (_) { /* Keep unreadable data for recovery. */ }

            lastError = 'Draft di perangkat ini tidak dapat dibaca. Data tersimpan belum dihapus.';
            return null;
          }
          return result;
        } catch (error) {
          lastError = storageError(error);
          return null;
        }
      },
      save(kind, id = 'new', payload) {
        lastError = '';

          lastError = 'Format draft tidak valid. Draft sebelumnya tetap disimpan.';
          return {ok:false, error:lastError};

          const savedAt = new Date().toISOString();

          const raw = JSON.stringify({version:1, savedAt, payload}, (name, value) =>
            name && (!safeName(name)) ? undefined : value);

            lastError = 'Format draft tidak valid. Draft sebelumnya tetap disimpan.';
            return {ok:false, error:lastError};

          return {ok:true, savedAt};
        } catch (error) {
          lastError = storageError(error);
          return {ok:false, error:lastError};
        }
      },
      remove(kind, id = 'new') {
        lastError = '';

          window.localStorage.removeItem(key(kind, id));
          return {ok:true};
        } catch (error) {
          lastError = storageError(error);
          return {ok:false, error:lastError};
        }
      }
    });
  }

  function notice(options = {}) {
    const {savedAt, restored = false, error = '', hasDraft = false, confirmDiscard = false} = options;
    let time = '';
    if (savedAt && Number.isFinite(Date.parse(savedAt))) {
      time = new Date(savedAt).toLocaleTimeString('id-ID', {hour:'2-digit', minute:'2-digit'});
    }
    const confirming = Boolean(hasDraft && confirmDiscard);
    const title = error ? 'Draft lokal bermasalah' : restored ? 'Draft dipulihkan' :
      hasDraft ? 'Draft tersimpan di perangkat ini' : 'Draft otomatis aktif';
    return `<div class="draft-notice${error?' is-error':''}${confirming?' is-confirming':''}" role="${error?'alert':'status'}" aria-live="polite"><span class="draft-notice-icon" aria-hidden="true">${error?'!':'↺'}</span><div class="draft-notice-copy"><strong>${esc(title)}${time && !error?` <small>· ${esc(time)}</small>`:''}</strong><p>${error?esc(error):'Isian dipertahankan saat popup ditutup atau halaman dimuat ulang.'}</p><small>Draft hanya untuk browser dan perangkat ini, belum tersimpan ke Google Sheets.</small>${confirming?'<div class="draft-discard-confirm"><span>Hapus draft ini? Isian yang belum disimpan akan dibuang.</span><div><button type="button" class="draft-confirm-delete" data-draft-action="confirm-discard">Ya, hapus draft</button><button type="button" data-draft-action="cancel-discard">Batal</button></div></div>':''}</div>${hasDraft && !confirming?'<button type="button" class="draft-discard" data-draft-action="ask-discard">Hapus draft</button>':''}</div>`;
  }

  function bindForm(form, options = {}) {
    const {store, kind = 'content', id = 'new', onDiscard, onRestore} = options;
    if (!form || !store) throw new TypeError('bindForm memerlukan form dan draft store.');
    const document = form.ownerDocument;
    const view = document.defaultView || window;
    const fixedId = id === 'new' ? null : String(id);
    let disposed = false, stopped = false, hasDraft = false, restored = false;
    let savedAt = '', error = '', confirmDiscard = false, lastSavedSnapshot = '';

    if (!host) {
      host = document.createElement('div');
      host.setAttribute('data-draft-status', '');
      form.prepend(host);
    }

    function groups() {
      const result = new Map();
      Array.from(form.elements).forEach(control => {
        const name = control.getAttribute('name');

      });

      return {fields};
    }

    function renderNotice() {
      host.innerHTML = notice({savedAt, restored, error, hasDraft, confirmDiscard});
    }

    function restore(fields) {
      const safeFields = Object.create(null);
      Object.entries(fields).forEach(([name, value]) => {
        if (safeName(name) && (typeof value === 'string' || typeof value === 'boolean' ||

      if (typeof onRestore === 'function') onRestore(safeFields);

        if (!hasOwn(safeFields, name)) return;

        if (first.type === 'radio') controls.forEach(control => { control.checked = control.value === String(value); });

          control.checked = Array.isArray(value) ? value.includes(control.value) : value === true;
        });
        else if (first.multiple) Array.from(first.options).forEach(option => {
          option.selected = Array.isArray(value) && value.includes(option.value);
        });
        else controls.forEach((control, index) => { control.value = String(Array.isArray(value) ? value[index] ?? '' : value); });
      });
    }

    const baseline = JSON.stringify(snapshot());
    const draft = store.read(kind, id);
    error = store.lastError || '';
    if (draft) {
      const fields = isObject(draft.payload?.fields) ? draft.payload.fields : draft.payload;
      try {
        restore(fields);
        hasDraft = true;
        restored = true;
        savedAt = draft.savedAt;
        lastSavedSnapshot = JSON.stringify(snapshot());
      } catch (_) {
        error = 'Draft belum dapat dipulihkan. Data tersimpan belum dihapus.';
      }
    }
    renderNotice();

    function flush() {
      if (disposed || stopped) return {ok:true, skipped:true};
      const payload = snapshot(), serialized = JSON.stringify(payload);
      if (serialized === baseline) {
        if (!hasDraft) return {ok:!error, skipped:true, ...(error?{error}:{})};
        const result = store.remove(kind, id);
        if (result.ok) {
          hasDraft = false; restored = false; savedAt = ''; error = ''; lastSavedSnapshot = '';
          confirmDiscard = false;
        } else error = result.error;
        renderNotice();
        return result;
      }
      if (hasDraft && serialized === lastSavedSnapshot && !error) return {ok:true, savedAt};
      const result = store.save(kind, id, payload);
      if (result.ok) {
        hasDraft = true; restored = false; savedAt = result.savedAt; error = '';
        lastSavedSnapshot = serialized;
      } else error = result.error;
      renderNotice();
      return result;
    }

    function markSaved() {
      // The server has accepted this editor. Cleanup must never recreate its draft.
      stopped = true;
      const result = store.remove(kind, id);
      if (result.ok) {
        hasDraft = false; restored = false; savedAt = ''; error = ''; confirmDiscard = false;
      } else error = result.error;
      renderNotice();
      return result;
    }

    function fieldChanged() {
      flush();
      // Capture synchronous dependent-field updates in ancestor change handlers too.
      Promise.resolve().then(() => { if (!disposed && !stopped) flush(); });
    }

    function draftAction(event) {
      const button = event.target.closest?.('[data-draft-action]');
      if (!button || !host.contains(button)) return;
      event.preventDefault();
      event.stopPropagation();
      const action = button.dataset.draftAction;
      if (action === 'ask-discard') { confirmDiscard = true; renderNotice(); }
      else if (action === 'cancel-discard') { confirmDiscard = false; renderNotice(); }
      else if (action === 'confirm-discard' && confirmDiscard) {
        const result = store.remove(kind, id);
        if (!result.ok) { error = result.error; renderNotice(); return; }
        stopped = true; hasDraft = false; restored = false; savedAt = ''; error = ''; confirmDiscard = false;
        renderNotice();
        if (typeof onDiscard === 'function') onDiscard();
      }
    }

    form.addEventListener('input', fieldChanged);
    form.addEventListener('change', fieldChanged);
    form.addEventListener('submit', flush, true);
    host.addEventListener('click', draftAction);
    view.addEventListener('pagehide', flush);
    view.addEventListener('beforeunload', flush);
    document.addEventListener('visibilitychange', flush);

    function dispose() {
      if (disposed) return;
      flush();
      disposed = true;
      form.removeEventListener('input', fieldChanged);
      form.removeEventListener('change', fieldChanged);
      form.removeEventListener('submit', flush, true);
      host.removeEventListener('click', draftAction);
      view.removeEventListener('pagehide', flush);
      view.removeEventListener('beforeunload', flush);
      document.removeEventListener('visibilitychange', flush);
    }

    return Object.freeze({flush, markSaved, dispose, get restored() { return restored; }});
  }

  window.ExataDrafts = Object.freeze({createStore, notice, bindForm});
})();

    const name = host.toLowerCase().replace(/^\[|\]$/g, '').replace(/\.$/, '');
    if (!name || name === 'localhost' || /\.(localhost|local|internal|lan|home|test|invalid)$/.test(name)) return false;

      const loaded = () => {
        clearTimeout(instance.timer);

function matches(c){return (division==='all'||c.division===division)&&(platform==='all'||c.platform===platform)&&(status==='all'||c.status===status)&&(!query||`${c.title} ${c.owner} ${c.division}`.toLowerCase().includes(query.toLowerCase()))}
function filtered(allDates=false){return contents.filter(c=>matches(c)&&(allDates||c.date.startsWith(monthKey()))).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time))}
function filteredInsights(){const ids=new Set(filtered().map(c=>c.id)),latest=new Map();insights.filter(i=>ids.has(i.contentId)).forEach(i=>{if(!latest.has(i.contentId)||i.date>latest.get(i.contentId).date)latest.set(i.contentId,i)});return [...latest.values()]}
function totals(rows=filteredInsights()){return rows.reduce((a,i)=>{['views','reach','likes','comments','shares','saves','replies'].forEach(k=>a[k]+=Number(i[k])||0);return a},{views:0,reach:0,likes:0,comments:0,shares:0,saves:0,replies:0})}
function provided(v){return v!==null&&v!==undefined&&v!==''}
function interactionKeys(i){const c=contents.find(c=>c.id===i.contentId);return c?.platform==='Instagram'&&/^story$/i.test(c.format)?['likes','replies','shares']:c?.platform==='TikTok'&&/^live$/i.test(c.format)?['likes','comments','shares']:['likes','comments','shares','saves']}
function interactionValue(i){const keys=interactionKeys(i),known=keys.filter(k=>provided(i[k]));return known.length?{sum:known.reduce((a,k)=>a+Number(i[k]),0),partial:known.length<keys.length}:null}
function er(t){if(t.contentId){const inter=interactionValue(t);if(!inter||inter.partial||!provided(t.views)||!t.views)return '—';return (inter.sum/t.views*100).toLocaleString('id-ID',{maximumFractionDigits:2})+'%'}const rows=filteredInsights();if(!rows.length||rows.some(i=>!provided(i.views)||!interactionValue(i)||interactionValue(i).partial)||!t.views)return '—';return (rows.reduce((a,i)=>a+interactionValue(i).sum,0)/t.views*100).toLocaleString('id-ID',{maximumFractionDigits:2})+'%'}
function metricValue(n,unit=''){return n===null||n===undefined||n===''?'—':num(n)+unit}

function stats(mode='calendar'){const cs=filtered(),t=totals();const scheduled=cs.filter(c=>c.status==='Terjadwal').length,published=cs.filter(c=>c.status==='Terbit').length;const cards=mode==='calendar'?[['Total konten',num(cs.length),'calendar','di kalender bulan ini'],['Konten terjadwal',num(scheduled),'clock','siap menemui audiens'],['Sudah terbit',num(published),'check','konten telah dipublikasikan'],['Total tayangan',filteredInsights().some(i=>provided(i.views))?short(t.views):'—','eye',`${num(filteredInsights().length)} laporan insight`]]:[['Total tayangan',filteredInsights().some(i=>provided(i.views))?short(t.views):'—','eye','tayangan konten'],['Total jangkauan',filteredInsights().some(i=>provided(i.reach))?short(t.reach):'—','users','hanya laporan yang menyediakan jangkauan'],['Interaksi tercatat',filteredInsights().some(i=>interactionValue(i))?short(filteredInsights().reduce((sum,i)=>sum+(interactionValue(i)?.sum||0),0)):'—','heart','jumlah dari metrik yang sudah diisi'],['Rasio interaksi',er(t),'activity','perhitungan dashboard, termasuk simpan']];return `<div class="stats-grid">${cards.map((a,i)=>`<div class="stat-card"><div class="stat-top"><span>${a[0]}</span><span class="stat-icon">${icon(a[2])}</span></div><span class="stat-value">${a[1]}</span><div class="stat-foot"><b>${icon('calendar')}${months[month]}</b><span>· ${a[3]}</span></div></div>`).join('')}</div>`}

function calendarGrid(){const first=new Date(year,month,1),offset=(first.getDay()+6)%7,days=new Date(year,month+1,0).getDate(),count=Math.ceil((offset+days)/7)*7;return `<div class="calendar-scroll"><div class="weekday-grid">${['SENIN','SELASA','RABU','KAMIS','JUMAT','SABTU','MINGGU'].map(d=>`<span>${d}</span>`).join('')}</div><div class="calendar-grid">${Array.from({length:count},(_,i)=>{const d=new Date(year,month,i-offset+1),ds=localDate(d),outside=d.getMonth()!==month,cs=contents.filter(c=>c.date===ds&&matches(c)).sort((a,b)=>a.time.localeCompare(b.time));return `<div class="day-cell ${outside?'outside':''} ${i%7>=5?'weekend':''}"><div class="day-top"><span class="day-number ${ds===todayStr?'today':''}">${d.getDate()}</span>${canEdit()?`<button class="day-add" data-date="${ds}" aria-label="Tambah konten ${dateLabel(ds)}">+</button>`:''}</div>${cs.map(eventCard).join('')}</div>`}).join('')}</div></div>`}

function chart(){const rows=insightRows();if(!rows.some(x=>provided(x.i.views)))return empty('Tayangan belum diisi.','Isi metrik tayangan untuk melihat grafik performa.');const days=new Date(year,month+1,0).getDate(),h=165,w=570;const series=['Instagram','TikTok'].map(p=>Array.from({length:days},(_,day)=>rows.filter(x=>x.c.platform===p&&Number(x.c.date.slice(-2))===day+1).reduce((sum,x)=>sum+x.i.views,0)));const max=Math.max(100,...series.flat());let lines='';for(let j=0;j<4;j++){const y=20+j*55;lines+=`<line x1="42" y1="${y}" x2="610" y2="${y}" stroke="#edf1e7" stroke-dasharray="3 4"/><text x="1" y="${y+3}">${short(max*(1-j/3))}</text>`}const polylines=series.map((values,k)=>{const points=values.map((v,day)=>`${42+day/(days-1)*w},${185-v/max*h}`).join(' ');return `<polyline points="${points}" fill="none" stroke="${k?'#60a5fa':'#2563eb'}" stroke-width="2" stroke-linejoin="round"/>`}).join('');return `<svg viewBox="0 0 630 215" role="img" aria-label="Tayangan terbaru per konten berdasarkan tanggal publikasi">${lines}${polylines}${[1,5,10,15,20,25,days].map(d=>`<text x="${42+(d-1)/(days-1)*w}" y="208" text-anchor="middle">${String(d).padStart(2,'0')} ${months[month].slice(0,3)}</text>`).join('')}</svg>`}
function divisionBars(){const rows=insightRows(),data=divisions.map(d=>({...d,views:rows.filter(x=>x.c.division===d.name).reduce((s,x)=>s+x.i.views,0)})),max=Math.max(1,...data.map(d=>d.views));return data.map(d=>`<div class="division-bar" style="--division:${d.color}"><div><span><span class="division-dot"></span> ${d.name}</span><strong>${short(d.views)}</strong></div><div class="bar-track"><span style="width:${d.views/max*100}%"></span></div></div>`).join('')}
function renderInsights(){return heading('Insight Konten','Pantau hasil konten dengan metrik yang sesuai Instagram dan TikTok.','add-insight','Input insight')+`<div class="workflow-banner"><span class="workflow-symbol">${icon('image')}</span><div><strong>Punya screenshot insight? Bantu isi angka secara otomatis.</strong><p>Unggah screenshot, periksa angka yang terbaca, lalu simpan sebagai catatan insight.</p></div><button class="btn" data-action="add-insight">Unggah screenshot ${icon('right')}</button></div>`+stats('insights')+`<section class="panel" style="margin-bottom:22px">${toolbar()}</section><div class="insights-layout"><section class="panel"><div class="section-title"><div><h2>Performa tayangan</h2><p>Tayangan terbaru menurut tanggal publikasi</p></div><div class="chart-legend"><span><b></b>Instagram</span><span><b></b>TikTok</span></div></div><div class="chart-container">${chart()}</div></section><section class="panel"><div class="section-title"><div><h2>Performa divisi</h2><p>Total tayangan setiap divisi</p></div>${icon('chart')}</div><div class="division-performance">${divisionBars()}</div></section></div><section class="panel"><div class="section-title"><div><h2>Detail insight konten</h2><p>${num(insightRows().length)} laporan terbaru · pilih Lihat / edit untuk semua metrik</p></div></div>${insightTable()}</section><p class="results-note">Rasio interaksi dashboard = (likes + komentar + balasan + bagikan + simpan) ÷ tayangan × 100%. Rumus ini merupakan perhitungan dashboard, bukan metrik resmi platform. Ringkasan memakai laporan terbaru setiap konten. Periode mengikuti bulan publikasi. Jangkauan dijumlahkan dan bukan audiens unik lintas konten. Tanda — berarti metrik belum tersedia. Rasio hanya dihitung bila tayangan dan seluruh metrik interaksi format tersebut terisi. Data diisi manual atau dibaca dari screenshot dan diperiksa oleh tim.</p>`}

function validateApiResponse(action,json,payload){
 const invalid=()=>{throw Error('Respons Apps Script untuk '+action+' tidak sesuai. Pastikan Code.gs terbaru sudah di-deploy sebagai versi baru pada URL /exec yang dipakai dashboard.');};
 if(action==='bootstrap'&&(!json.user||!Array.isArray(json.contents)||!Array.isArray(json.insights)))invalid();
 if(action==='login'&&(!json.user||typeof json.token!=='string'||!json.token))invalid();
 if(action==='saveContent'){
  const c=json.content;if(!c||typeof c.id!=='string'||!c.id||typeof c.title!=='string'||typeof c.date!=='string')invalid();
  if(payload.content?.id&&c.id!==payload.content.id)invalid();
 }
 if(action==='saveInsight'){
  const i=json.insight;if(!i||typeof i.id!=='string'||!i.id||i.contentId!==payload.insight?.contentId||i.date!==payload.insight?.date)invalid();
 }
 if(json.history!==undefined&&!Array.isArray(json.history))invalid();
}
async function api(action,data={}){
 const L={saveContent:['Mengunggah konten','Menyimpan ke Google Sheets…'],saveInsight:['Mengunggah insight','Menyimpan ke Google Sheets…'],deleteContent:['Menghapus konten','Memperbarui Google Sheets…']}[action],px=L?XL.start(L[0],L[1],20,90):null;
 try{const r=await api0(action,data);px?.end(true,'Tersimpan');return r}catch(e){px?.end(false);throw e}
}
async function api0(action,data={}){
 if(!endpoint)throw Error('URL Apps Script belum diatur oleh admin.');
 const requestToken=session?.token,requestEndpoint=endpoint;
 const payload={...data,action,token:requestToken};
 let json;
 if(window.google?.script?.run){
   json=await new Promise((resolve,reject)=>{
     let settled=false;
     const finish=(fn,value)=>{if(settled)return;settled=true;clearTimeout(timer);fn(value)};
     const timer=setTimeout(()=>finish(reject,Error('Koneksi melewati batas waktu. Data yang sedang dikirim mungkin masih diproses; coba sinkronkan sebelum mengirim ulang.')),action==='login'?180000:30000);
     try{window.google.script.run.withSuccessHandler(result=>finish(resolve,result)).withFailureHandler(()=>finish(reject,Error('Tidak dapat menghubungi Apps Script. Periksa koneksi dan deployment.'))).apiRequest(payload)}catch{finish(reject,Error('Koneksi Apps Script belum tersedia. Muat ulang halaman.'))}
   });
 }else{
   let res;
   try{res=await fetch(requestEndpoint,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload),redirect:'follow',signal:AbortSignal.timeout(action==='login'?180000:30000)})}
   catch(e){throw Error(e.name==='TimeoutError'?'Koneksi melewati batas waktu. Coba sinkronkan sebelum mengirim ulang.':'Tidak dapat menghubungi Apps Script. Periksa koneksi dan akses deployment.')}
   try{json=await res.json()}catch{throw Error('Respons Apps Script tidak valid. Pastikan Code.gs terbaru telah di-deploy dan akses Web App: Anyone.')}
   if(!res.ok&&json?.ok)throw Error('Layanan mengembalikan respons yang tidak sesuai.');
 }
 if(!json||json.ok!==true){
   if(json?.error?.startsWith('Sesi berakhir')&&action!=='logout'){
     setTimeout(()=>{if(session?.token!==requestToken||endpoint!==requestEndpoint)return;session=null;writeLocal('exata-session',null);demo=false;dataRevision++;contents=[];insights=[];history=[];render();loginModal('Akun perlu masuk kembali. Sesi tidak lagi valid atau akses akun berubah.');},0);
   }
   throw Error(json?.error||'Permintaan gagal. Silakan coba lagi.');
 }
 validateApiResponse(action,json,data);return json;
}

function currentDraftStore(){

document.addEventListener('change',e=>{if(e.target.id==='pv-platform'){pvPlatform=e.target.value;pvLimit=24;render()}if(e.target.id==='sm-type')$('#sm-lbl').textContent=e.target.value==='month'?'Pilih tanggal dalam bulan':'Pilih tanggal dalam minggu'});
let pvT;document.addEventListener('input',e=>{if(e.target.id==='pv-search'){pvQuery=e.target.value;clearTimeout(pvT);pvT=setTimeout(()=>{render();const i=$('#pv-search');i?.focus();i?.setSelectionRange(i.value.length,i.value.length)},220)}});
/* Ringkasan mingguan / bulanan per divisi (PDF) */
function summaryModal(){openModal('Ringkasan PDF per divisi',`<p class="modal-subtitle">Ringkasan berupa kalimat: aktivitas, performa, dan hal yang perlu ditindaklanjuti.</p><div class="form-grid"><div class="field"><label for="sm-type">Periode</label><select id="sm-type"><option value="week">Mingguan (Senin–Minggu)</option><option value="month">Bulanan</option></select></div><div class="field"><label for="sm-div">Divisi</label><select id="sm-div"><option value="all">Semua divisi</option>${divisions.map(d=>`<option>${d.name}</option>`).join('')}</select></div><div class="field full"><label id="sm-lbl" for="sm-date">Pilih tanggal dalam minggu</label><input id="sm-date" type="date" value="${todayStr}"></div></div><div class="form-error" id="form-error" role="alert"></div><div class="form-actions"><button class="btn" data-action="close-modal">Batal</button><button class="btn primary" data-sum="1">${icon('file')}Unduh PDF</button></div>`)}
function period(type,ds){const[y,m,d]=ds.split('-').map(Number),L=x=>localDate(x);if(type==='month')return{a:L(new Date(y,m-1,1)),b:L(new Date(y,m,0)),pa:L(new Date(y,m-2,1)),pb:L(new Date(y,m-1,0)),label:months[m-1]+' '+y,prev:'bulan lalu',word:'bulan ini',slug:`${y}-${String(m).padStart(2,'0')}`};const o=(new Date(y,m-1,d).getDay()+6)%7,a=L(new Date(y,m-1,d-o));return{a,b:L(new Date(y,m-1,d-o+6)),pa:L(new Date(y,m-1,d-o-7)),pb:L(new Date(y,m-1,d-o-1)),label:dateLabel(a)+' – '+dateLabel(L(new Date(y,m-1,d-o+6))),prev:'minggu lalu',word:'minggu ini',slug:a}}
function latestOf(cs){const ids=new Set(cs.map(c=>c.id)),m=new Map();insights.filter(i=>ids.has(i.contentId)).forEach(i=>{const p=m.get(i.contentId);if(!p||i.date>p.date)m.set(i.contentId,i)});return[...m.values()]}
const topOf=(arr,f)=>{const m={};arr.forEach(c=>{const k=f(c);m[k]=(m[k]||0)+1});return Object.entries(m).sort((a,b)=>b[1]-a[1])[0]};
function listJoin(a){return a.length<2?a.join(''):a.slice(0,-1).join(', ')+' dan '+a[a.length-1]}
function divNarrative(name,p){const cs=contents.filter(c=>c.division===name&&c.date>=p.a&&c.date<=p.b).sort((x,y)=>(x.date+x.time).localeCompare(y.date+y.time)),prev=contents.filter(c=>c.division===name&&c.date>=p.pa&&c.date<=p.pb),n=cs.length,cnt=s=>cs.filter(c=>c.status===s).length,ins=latestOf(cs),t=totals(ins),pt=totals(latestOf(prev)),inter=ins.reduce((s,i)=>s+(interactionValue(i)?.sum||0),0),ps=[];
 if(!n)ps.push(`Belum ada konten ${name} yang dijadwalkan pada ${p.label}. ${prev.length?`Pada ${p.prev} tercatat ${prev.length} konten, sehingga periode ini perlu segera diisi.`:'Tambahkan jadwal baru di Kalender Konten agar tim punya arah kerja yang jelas.'}`);
 else{const ig=cs.filter(c=>c.platform==='Instagram').length,tt=n-ig,bits=[];if(cnt('Terbit'))bits.push(`${cnt('Terbit')} sudah terbit`);if(cnt('Terjadwal'))bits.push(`${cnt('Terjadwal')} terjadwal`);if(cnt('Review'))bits.push(`${cnt('Review')} menunggu review`);if(cnt('Draft'))bits.push(`${cnt('Draft')} masih draft`);
  ps.push(`Pada ${p.label}, ${name} merencanakan ${n} konten: ${ig} di Instagram dan ${tt} di TikTok. Dari jumlah itu, ${listJoin(bits)}.`);
  const f=topOf(cs,c=>c.format),d=topOf(cs,c=>c.date),owners=[...new Set(cs.map(c=>c.owner))];
  ps.push(`Format yang paling sering dipakai adalah ${f[0]} (${f[1]} konten). Hari tersibuk jatuh pada ${postDate(d[0])} dengan ${d[1]} konten. Konten dikerjakan oleh ${listJoin(owners)}.${prev.length?` Dibanding ${p.prev} (${prev.length} konten), jumlah konten ${n>prev.length?'bertambah':n<prev.length?'berkurang':'sama'}${n===prev.length?'':' '+Math.abs(n-prev.length)}.`:''}`);
  if(ins.length){const best=ins.slice().sort((a,b)=>(b.views||0)-(a.views||0))[0],bc=contents.find(c=>c.id===best.contentId),pct=pt.views?Math.round((t.views-pt.views)/pt.views*100):null;
   ps.push(`${ins.length} konten sudah punya data insight. Total tayangan mencapai ${num(t.views)}, jangkauan ${num(t.reach)}, dan interaksi ${num(inter)} (like, komentar, bagikan, simpan). Konten terbaik adalah "${bc?.title||'—'}" di ${bc?.platform||'-'} dengan ${num(best.views)} tayangan.${pct===null?'':` Dibanding ${p.prev}, tayangan ${pct>=0?'naik':'turun'} ${Math.abs(pct)}%.`}`)}
  else ps.push('Belum ada data insight untuk periode ini. Isi lewat menu Input Insight agar performa konten dapat dirangkum.');
  const open=cs.filter(c=>c.status==='Draft'||c.status==='Review'),next=cs.find(c=>c.status!=='Terbit'&&c.date>=todayStr);
  ps.push(open.length?`Perlu tindak lanjut: ${cnt('Review')} konten menunggu review dan ${cnt('Draft')} masih draft.${next?` Konten terdekat yang belum terbit adalah "${next.title}" pada ${postDate(next.date)} pukul ${next.time} WIB.`:''}`:'Semua konten pada periode ini sudah siap tayang atau sudah terbit. Tidak ada draft maupun review yang tertunda.')}
 return{name,color:(divisions.find(d=>d.name===name)||divisions[0]).color,tiles:[['Total konten',num(n)],['Sudah terbit',num(cnt('Terbit'))],['Tayangan',ins.length?short(t.views):'—'],['Interaksi',ins.length?short(inter):'—']],ps,list:cs,n,views:t.views}}
async function summaryPDF(title,sub,intro,secs,px){const W=595,H=842,S=2.2,M=42,pages=[];let ctx,y;const F=(z,b)=>`${b?700:400} ${z}px "DM Sans",Arial,sans-serif`;
 function page(){const cv=document.createElement('canvas');cv.width=W*S;cv.height=H*S;ctx=cv.getContext('2d');ctx.scale(S,S);ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);ctx.fillStyle='#2563eb';ctx.fillRect(0,0,W,6);ctx.font=F(9,1);ctx.fillText('EXATA / CONTENT HUB',M,28);ctx.fillStyle='#94a3b8';ctx.font=F(8);ctx.textAlign='right';ctx.fillText('Halaman '+(pages.length+1),W-M,H-22);ctx.textAlign='left';pages.push(cv);y=56}
 const wrap=(t,z,b,w)=>{ctx.font=F(z,b);const o=[];String(t).split('\n').forEach(par=>{let cur='';par.split(/\s+/).forEach(wd=>{const x=cur?cur+' '+wd:wd;if(cur&&ctx.measureText(x).width>w){o.push(cur);cur=wd}else cur=x});o.push(cur)});return o};
 function text(t,z,col,b,gap=6,x=M,w=W-2*M){const lh=z*1.55;for(const l of wrap(t,z,b,w)){if(y+lh>H-44)page();ctx.fillStyle=col;ctx.font=F(z,b);ctx.fillText(l,x,y+z);y+=lh}y+=gap}
 page();text(title,22,'#1e293b',1,2);text(sub,10,'#64748b',0,14);intro.forEach(t=>text(t,11,'#334155',0,8));
 secs.forEach((sc,i)=>{if(i||intro.length)page();ctx.fillStyle=sc.color;ctx.fillRect(M,y,W-2*M,34);ctx.fillStyle='#fff';ctx.font=F(15,1);ctx.fillText(sc.name,M+14,y+22);y+=48;
  const tw=(W-2*M-30)/4;sc.tiles.forEach((tl,k)=>{const x=M+k*(tw+10);ctx.fillStyle='#eff6ff';ctx.fillRect(x,y,tw,46);ctx.fillStyle='#1e293b';ctx.font=F(15,1);ctx.fillText(tl[1],x+10,y+22);ctx.fillStyle='#64748b';ctx.font=F(8);ctx.fillText(tl[0],x+10,y+37)});y+=64;
  text('Ringkasan',12,sc.color,1,4);sc.ps.forEach(t=>text(t,10.5,'#334155',0,7));
  if(sc.list.length){y+=4;text('Daftar konten dan waktu posting',12,sc.color,1,4);sc.list.forEach(c=>text(`${postDate(c.date)} · ${c.time} WIB · ${c.platform} · ${statusLabel(c.status)}\n${c.title}`,9,'#475569',0,3))}});
 const out=[];for(let i=0;i<pages.length;i++){px?.to(30+60*(i+1)/pages.length,`Menyusun halaman ${i+1} dari ${pages.length}`);const blob=await new Promise(r=>pages[i].toBlob(r,'image/jpeg',.9));out.push({w:pages[i].width,h:pages[i].height,bytes:new Uint8Array(await blob.arrayBuffer())})}
 const enc=new TextEncoder(),ch=[],off=[];let len=0;const add=b=>{b=typeof b==='string'?enc.encode(b):b;ch.push(b);len+=b.length},obj=(id,body)=>{off[id]=len;add(`${id} 0 obj\n${body}\nendobj\n`)};add('%PDF-1.4\n');obj(1,'<</Type/Catalog/Pages 2 0 R>>');obj(2,`<</Type/Pages/Count ${out.length}/Kids[${out.map((_,i)=>`${3+i*3} 0 R`).join(' ')}]>>`);
 out.forEach((p,i)=>{const pg=3+i*3,st=`q ${W} 0 0 ${H} 0 0 cm /I Do Q`;obj(pg,`<</Type/Page/Parent 2 0 R/MediaBox[0 0 ${W} ${H}]/Resources<</XObject<</I ${pg+2} 0 R>>>>/Contents ${pg+1} 0 R>>`);obj(pg+1,`<</Length ${st.length}>>\nstream\n${st}\nendstream`);off[pg+2]=len;add(`${pg+2} 0 obj\n<</Type/XObject/Subtype/Image/Width ${p.w}/Height ${p.h}/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length ${p.bytes.length}>>\nstream\n`);add(p.bytes);add('\nendstream\nendobj\n')});
 const total=3+out.length*3,xr=len;add(`xref\n0 ${total}\n0000000000 65535 f \n`+Array.from({length:total-1},(_,i)=>String(off[i+1]).padStart(10,'0')+' 00000 n \n').join('')+`trailer\n<</Size ${total}/Root 1 0 R>>\nstartxref\n${xr}\n%%EOF`);return new Blob(ch,{type:'application/pdf'})}
async function makeSummary(){const type=$('#sm-type').value,dv=$('#sm-div').value,ds=$('#sm-date').value;if(!/^\d{4}-\d{2}-\d{2}$/.test(ds)){$('#form-error').textContent='Pilih tanggal terlebih dahulu.';return}closeModal();const px=XL.start('Menyusun ringkasan PDF','Membaca data kalender dan insight…',20,60);try{const p=period(type,ds),names=dv==='all'?divisions.map(d=>d.name):[dv],secs=names.map(n=>divNarrative(n,p));px.to(30,'Menulis ringkasan…');
 const title=(type==='month'?'Ringkasan Bulanan Konten':'Ringkasan Mingguan Konten')+(dv==='all'?'':' - '+dv),sub=`Periode ${p.label} · dibuat ${new Intl.DateTimeFormat('id-ID',{dateStyle:'long',timeStyle:'short'}).format(new Date())}`,intro=[];
 if(dv==='all'){const tot=secs.reduce((a,x)=>a+x.n,0),act=secs.slice().sort((a,b)=>b.n-a.n)[0],best=secs.filter(x=>x.views).sort((a,b)=>b.views-a.views)[0];intro.push(tot?`Pada ${p.label}, enam divisi merencanakan total ${tot} konten. Divisi paling aktif adalah ${act.name} dengan ${act.n} konten.${best?` Tayangan tertinggi datang dari ${best.name} dengan ${num(best.views)} tayangan.`:' Data insight belum tersedia untuk periode ini.'}`:`Belum ada konten yang dijadwalkan pada ${p.label}.`,'Halaman berikut merangkum setiap divisi: aktivitas konten, performa, dan hal yang perlu ditindaklanjuti, lengkap dengan waktu posting tiap konten.')}
 const blob=await summaryPDF(title,sub,intro,secs,px);const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`ringkasan-${type==='month'?'bulanan':'mingguan'}-${dv==='all'?'semua-divisi':dv.toLowerCase().replace(/[^a-z0-9]+/g,'-')}-${p.slug}.pdf`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),60000);px.end(true,'Unduhan dimulai');toast('Ringkasan PDF berhasil dibuat.')}catch(e){px.end(false);toast('Gagal membuat ringkasan: '+e.message)}}

const brandImage=$('.brand-image');if(brandImage)brandImage.src=window.EXATA_CONFIG.logoUrl;
window.addEventListener('storage',event=>{if(event.key!=='exata-session')return;const next=readLocal('exata-session',null);if(!next||next.endpoint!==endpoint){session=null;demo=false;dataRevision++;contents=[];insights=[];history=[];closeModal();render();loginModal('Akun telah keluar di tab lain.');}});
if(session)cacheLoad();render();if(session)sync(false);else loginModal();
